name: Azure Update Manager Collection

on:
  workflow_dispatch:
    inputs:
      enable_silver:
        description: Run the optional Silver curation step
        required: false
        default: false
        type: boolean

  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aum-collection
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
  AZURE_SUBSCRIPTION_IDS: ${{ vars.AZURE_SUBSCRIPTION_IDS }}
  ENABLE_SILVER: ${{ inputs.enable_silver || 'false' }}

jobs:
  extract_bronze:
    name: Extract AUM Bronze data
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: azurecloud

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f requirements.txt ]]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi

      - name: Run AUM Bronze extraction
        run: |
          mkdir -p out
          python scripts/export_aum.py

      - name: Upload Bronze manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aum-bronze-manifest-${{ github.run_id }}
          path: out/manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload extraction logs and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aum-bronze-output-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 7

  curate_silver:
    name: Curate optional Silver data
    needs: extract_bronze
    if: >
      ${{
        github.event_name == 'schedule' ||
        inputs.enable_silver == true
      }}
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download Bronze extraction output
        uses: actions/download-artifact@v4
        with:
          name: aum-bronze-output-${{ github.run_id }}
          path: out

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f requirements.txt ]]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi

      - name: Run Silver curation
        if: env.ENABLE_SILVER == 'true'
        run: |
          python scripts/curate_silver.py

      - name: Upload Silver output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aum-silver-output-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 7
